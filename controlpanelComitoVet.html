<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b33" />
    <title>VetCommitto | بوابة الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <style>
      :root { --navy: #0d1b33; --purple: #1e3f70; --slate: #606d85; --paper: #f5f7fa; --line: #e2e6ed; --card-bg: #fff; --card-border: #dfe3ed; --btn-bg: #f0f3f7; --gold: #d1aa5c; --ink: #1a2233;}
      [data-theme="dark"] { --navy: #e0e5ed; --purple: #8baccf; --slate: #949daf; --paper: #0b1120; --line: #334155; --card-bg: #1e293b; --card-border: #334155; --btn-bg: #334155; --ink: #e0e5ed;}
      * { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans Arabic", sans-serif; padding-bottom: 80px;}
      button, input, select, textarea { font: inherit; } button { cursor: pointer; }
      .wrap { width: min(1000px, calc(100% - 30px)); margin-inline: auto; }
      .topbar { background: var(--card-bg); border-bottom: 1px solid var(--line); padding: 15px 0; position: sticky; top: 0; z-index: 100; }
      .navrow { display: flex; justify-content: space-between; align-items: center; } .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--navy); }
      .tab-bar { display: flex; gap: 10px; margin-top: 30px; border-bottom: 1px solid var(--line); padding-bottom: 15px; overflow-x: auto;}
      .tab-btn { background: transparent; border: none; padding: 8px 16px; font-size: 14px; color: var(--slate); font-weight: 600; border-radius: 8px; transition: 0.2s; white-space: nowrap;}
      .tab-btn.active { background: var(--btn-bg); color: var(--purple); }
      .tab-content { display: none; margin-top: 30px; animation: fadein 0.3s; } .tab-content.active { display: block; }
      @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
      .card-title { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: var(--navy); margin: 0 0 20px; }
      .field { width: 100%; border: 1px solid var(--card-border); background: var(--paper); padding: 12px 14px; border-radius: 10px; outline: none; color: var(--ink); font-size: 13px; margin-bottom: 15px;}
      .primary-btn { border: 0; background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: 0.2s; }
      .ghost-btn { border: 1px solid var(--line); background: var(--card-bg); color: var(--navy); padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; display: inline-flex; justify-content: center; gap: 8px; width: 100%; transition: 0.2s; }
      .danger-btn { border: 0; background: #fee2e2; color: #dc2626; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; }
      .data-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); gap: 15px; margin-bottom: 10px;}
      .data-meta { font-size: 13px; color: var(--navy); font-weight: 600; } .data-sub { font-size: 11px; color: var(--slate); margin-top: 4px; display: block;}
      .filters-row { display: flex; gap: 10px; margin-bottom: 20px; background: var(--btn-bg); padding: 10px; border-radius: 12px;} .filter-sel { border: 1px solid var(--line); background: var(--card-bg); color: var(--navy); border-radius: 8px; padding: 6px 10px; font-size: 12px;}
      .toast { position: fixed; bottom: 20px; left: 20px; background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13px; display: flex; gap: 10px; z-index: 3000; animation: fadein 0.3s forwards; }
      #loginOverlay { position: fixed; inset: 0; background: var(--card-bg); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    </style>
  </head>
  <body>
    <div id="loginOverlay"><div class="card" style="width:400px; text-align:center;"><h2 style="color:var(--navy);">تسجيل الدخول</h2><input type="email" id="authEmail" class="field" placeholder="البريد الإلكتروني" /><input type="password" id="authPass" class="field" placeholder="كلمة المرور" /><button class="primary-btn" id="loginBtn">دخول</button></div></div>
    <header class="topbar"><div class="wrap navrow"><div class="brand"><i data-lucide="shield-check" width="24" style="color:var(--gold)"></i> VetCommitto | الإدارة</div><button id="logoutBtn" style="border:none; background:none; color:var(--slate); display:none;">خروج</button></div></header>
    <main class="wrap" style="display:none;" id="mainContent">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="tab-courses">المساقات</button><button class="tab-btn" data-tab="tab-exams">الامتحانات</button><button class="tab-btn" data-tab="tab-announcements">الإعلانات</button><button class="tab-btn" data-tab="tab-system">بيانات النظام</button>
      </div>
      <div id="tab-courses" class="tab-content active">
        <div class="card"><h3 class="card-title">إضافة مساق</h3><form id="courseForm"><input type="text" id="cName" class="field" placeholder="اسم المساق" required /><input type="text" id="cCode" class="field" placeholder="الرمز" /><div style="display:flex; gap:10px;"><select id="cYear" class="field"><option value="1">سنة 1</option><option value="2">سنة 2</option><option value="3">سنة 3</option><option value="4">سنة 4</option><option value="5">سنة 5</option><option value="6">سنة 6</option></select><select id="cSem" class="field"><option value="1">أول</option><option value="2">ثاني</option><option value="summer">صيفي</option></select></div><button type="submit" class="primary-btn">إضافة</button></form></div>
        <div class="card"><h3 class="card-title">إدارة المساقات</h3><div class="filters-row"><select id="filterYear" class="filter-sel"><option value="all">كل السنوات</option><option value="1">سنة 1</option><option value="2">سنة 2</option><option value="3">سنة 3</option><option value="4">سنة 4</option><option value="5">سنة 5</option><option value="6">سنة 6</option></select><select id="filterSem" class="filter-sel"><option value="all">كل الفصول</option><option value="1">أول</option><option value="2">ثاني</option><option value="summer">صيفي</option></select></div><div id="coursesList"></div></div>
      </div>
      <div id="tab-exams" class="tab-content"><div class="card"><h3 class="card-title">إضافة امتحان</h3><form id="examForm"><input type="text" id="exTitle" class="field" placeholder="اسم الامتحان" required /><input type="date" id="exDate" class="field" required /><div style="display:flex; gap:10px;"><input type="time" id="exTime" class="field" /><input type="text" id="exPlace" class="field" placeholder="القاعة" /></div><select id="exCourse" class="field"><option value="">بدون مساق</option></select><button type="submit" class="primary-btn">إضافة</button></form></div><div class="card"><div id="examsList"></div></div></div>
      <div id="tab-announcements" class="tab-content"><div class="card"><form id="annForm"><input type="text" id="aTitle" class="field" placeholder="العنوان" required /><textarea id="aMsg" class="field" placeholder="النص..."></textarea><button type="submit" class="primary-btn">نشر</button></form></div><div class="card"><div id="annsList"></div></div></div>
      <div id="tab-system" class="tab-content">
        <div class="card" style="border: 2px dashed #ef4444;"><h3 class="card-title" style="color:#ef4444"><i data-lucide="trash-2"></i> تنظيف التكرار</h3><p style="font-size:13px; color:var(--slate); margin-bottom:15px;">سيقوم هذا الزر بفحص جميع المساقات وحذف النسخ المكررة وإبقاء نسخة واحدة فقط.</p><button id="cleanBtn" class="primary-btn" style="background:#ef4444;">تنظيف المواد المكررة الآن</button></div>
        <div class="card"><button id="exportBtn" class="ghost-btn" style="margin-bottom:15px;">تحميل النسخة الاحتياطية</button><textarea id="jsonInput" class="field" rows="4" placeholder="استيراد JSON..."></textarea><button id="importBtn" class="primary-btn">مزامنة</button></div>
      </div>
    </main>
    <div id="toastRegion"></div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
      const app = initializeApp({ apiKey: "AIzaSyBisfCjLqOo-4_XU2XI_Ig5RDfCmJ5nx4Q", authDomain: "vetcommitto.firebaseapp.com", projectId: "vetcommitto", storageBucket: "vetcommitto.firebasestorage.app" });
      const auth = getAuth(app); const db = getFirestore(app);
      const UI = { el: id => document.getElementById(id), toast(msg) { const t = document.createElement("div"); t.className="toast"; t.innerHTML=`<span>${msg}</span>`; this.el("toastRegion").append(t); setTimeout(()=>t.remove(),4000); }};
      let state = { courses: [], exams: [], anns: [] };
      onAuthStateChanged(auth, u => { if(u){ UI.el("loginOverlay").style.display="none"; UI.el("mainContent").style.display="block"; UI.el("logoutBtn").style.display="block"; loadAll(); } else { UI.el("loginOverlay").style.display="flex"; UI.el("mainContent").style.display="none"; UI.el("logoutBtn").style.display="none"; }});
      UI.el("loginBtn").onclick = () => signInWithEmailAndPassword(auth, UI.el("authEmail").value, UI.el("authPass").value);
      UI.el("logoutBtn").onclick = () => signOut(auth);
      document.querySelectorAll(".tab-btn").forEach(b => b.onclick = () => { document.querySelectorAll(".tab-btn, .tab-content").forEach(x => x.classList.remove("active")); b.classList.add("active"); UI.el(b.dataset.tab).classList.add("active"); });
      async function loadAll() {
        const [cs, ex, an] = await Promise.all([getDocs(collection(db, "acad_courses")), getDocs(collection(db, "acad_exams")), getDocs(collection(db, "acad_announcements"))]);
        state.courses = cs.docs.map(d => ({id:d.id, ...d.data()})); state.exams = ex.docs.map(d => ({id:d.id, ...d.data()})); state.anns = an.docs.map(d => ({id:d.id, ...d.data()}));
        renderCourses(); UI.el("exCourse").innerHTML = `<option value="">بدون مساق</option>` + state.courses.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
        UI.el("examsList").innerHTML = state.exams.map(e => `<div class="data-item"><div><b>${e.title}</b><small>${e.date}</small></div><button class="danger-btn" onclick="del('acad_exams','${e.id}')">حذف</button></div>`).join("");
        UI.el("annsList").innerHTML = state.anns.map(a => `<div class="data-item"><div><b>${a.title}</b></div><button class="danger-btn" onclick="del('acad_announcements','${a.id}')">حذف</button></div>`).join("");
      }
      function renderCourses() {
        const yF = UI.el("filterYear").value, sF = UI.el("filterSem").value;
        const filtered = state.courses.filter(c => (yF==="all" || c.year===yF) && (sF==="all" || c.semester===sF));
        UI.el("coursesList").innerHTML = filtered.map(c => `<div class="data-item"><div><b>${c.name}</b><br><small>سنة ${c.year} - فصل ${c.semester}</small></div><button class="danger-btn" onclick="del('acad_courses','${c.id}')">حذف</button></div>`).join("");
      }
      UI.el("filterYear").onchange = renderCourses; UI.el("filterSem").onchange = renderCourses;
      window.del = async (col, id) => { if(confirm("تأكيد الحذف؟")){ await deleteDoc(doc(db, col, id)); loadAll(); }};
      
      // Cleanup Duplicates Magic Button!
      UI.el("cleanBtn").onclick = async () => {
        if(!confirm("هل أنت متأكد من حذف المواد المكررة؟")) return;
        UI.toast("جاري التنظيف... يرجى الانتظار");
        try {
          const snap = await getDocs(collection(db, "acad_courses"));
          const seen = new Set(); let deleted = 0;
          for (let d of snap.docs) {
            const c = d.data();
            const key = (c.code || c.name).trim(); 
            if (seen.has(key)) { await deleteDoc(doc(db, "acad_courses", d.id)); deleted++; } 
            else { seen.add(key); }
          }
          setDoc(doc(db, "acad_settings", "meta"), { v: Date.now().toString() }, { merge:true });
          UI.toast(`تم مسح ${deleted} مساق مكرر!`); loadAll();
        } catch(e) { UI.toast("خطأ بالتنظيف"); }
      };
      lucide.createIcons();
    </script>
  </body>
</html>
