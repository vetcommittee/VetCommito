<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الخطة الشجرية التفاعلية | VetCommitto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <style>
        :root {
            --navy: #0d1b33; --purple: #1e3f70; --gold: #d1aa5c; --slate: #606d85;
            --paper: #f5f7fa; --card-bg: #fff; --card-border: #dfe3ed;
            --nav-bg: #fbfbfd; --nav-border: #e8eaf1;

            /* ألوان الخطة الشجرية */
            --tree-line: #606d85;
            --tree-line-dashed: #a8bcd9;
            
            --node-y1: linear-gradient(135deg, #0f172a, #1e293b);
            --node-y2: linear-gradient(135deg, #311b92, #4338ca);
            --node-y3: linear-gradient(135deg, #1e3a8a, #2563eb);
        }

        [data-theme="dark"] {
            --navy: #e0e5ed; --purple: #8baccf; --paper: #0b1120;
            --card-bg: #1e293b; --card-border: #334155; --nav-bg: #0f172a; --nav-border: #1e293b;
            --tree-line: #949daf; --tree-line-dashed: #475569;
        }

        body { margin: 0; background: var(--paper); color: var(--navy); font-family: "IBM Plex Sans Arabic", sans-serif; overflow: hidden; }
        a { color: inherit; text-decoration: none; }
        
        /* Topbar & Header */
        .topbar { height: 70px; background: var(--nav-bg); border-bottom: 1px solid var(--nav-border); display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; padding: 0 20px;}
        .navrow { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1200px; margin: 0 auto;}
        .brand { display: flex; align-items: center; gap: 13px; font-weight: 700; color: var(--navy); }
        .brand-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); }
        .back-btn { width: 40px; height: 40px; border: 1px solid var(--card-border); background: var(--card-bg); border-radius: 12px; display: grid; place-items: center; color: var(--navy); transition: 0.2s; cursor: pointer;}
        .back-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold);}

        .page-header { text-align: center; padding: 20px 10px; z-index: 10; position: relative;}
        .page-header h1 { color: var(--navy); font-size: 22px; margin: 0 0 5px; font-weight: 800; }
        .page-header p { color: var(--slate); font-size: 13px; margin: 0 0 15px; }

        .controls-row { display: flex; justify-content: center; gap: 15px; align-items: center;}
        .legend { background: var(--card-bg); padding: 8px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: inline-flex; gap: 15px; font-size: 12px; font-weight: 700; color: var(--navy); border: 1px solid var(--card-border); }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-line { width: 25px; height: 3px; background: var(--tree-line); border-radius: 2px; }
        .legend-line.dashed { background: transparent; border-bottom: 3px dashed var(--tree-line-dashed); }
        
        .reset-btn { background: #fee2e2; color: #dc2626; border: none; padding: 8px 20px; border-radius: 30px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; display: none; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(220, 38, 38, 0.2);}
        .reset-btn:hover { background: #ef4444; color: #fff; }

        /* Container for Pan & Zoom */
        .map-container { width: 100vw; height: calc(100vh - 180px); overflow: auto; cursor: grab; position: relative; background: radial-gradient(circle at 50% 50%, rgba(13, 27, 51, 0.03) 0%, transparent 60%); }
        .map-container:active { cursor: grabbing; }

        /* Scale Wrapper - تم توسعته لمنع تداخل المواد */
        .tree-scale-wrapper { position: relative; width: 2000px; height: 1100px; margin: 30px auto; transform-origin: top center; transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); }

        #svg-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* تأثيرات الخطوط عند التفاعل */
        path { transition: stroke 0.3s, stroke-width 0.3s, opacity 0.3s; }
        .path-dimmed { opacity: 0.1 !important; }
        .path-highlighted { stroke: var(--gold) !important; stroke-width: 3.5px !important; opacity: 1 !important; z-index: 100;}

        /* Y-Axis Labels - تم عزلهم على أقصى اليمين */
        .year-label { position: absolute; right: 50px; font-size: 26px; font-weight: 900; color: var(--navy); border-right: 5px solid var(--gold); padding-right: 15px; width: 160px; text-align: right; background: rgba(255,255,255,0.8); border-radius: 8px; padding-top: 5px; padding-bottom: 5px; backdrop-filter: blur(5px);}
        .yl-1 { top: 90px; } .yl-2 { top: 360px; } .yl-3 { top: 730px; }

        /* Course Node (البطاقة) */
        .course-node {
            position: absolute; width: 120px; height: 55px; padding: 5px;
            border-radius: 12px; text-align: center; font-size: 11px;
            font-weight: 700; line-height: 1.3; color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; border: 2px solid transparent;
        }

        .course-node:hover { transform: translateY(-5px) scale(1.08); box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-color: var(--gold); z-index: 50; }
        .course-code { font-size: 9px; opacity: 0.9; margin-bottom: 2px; font-weight: 500; color: #facc15; }

        .y1 { background: var(--node-y1); }
        .y2 { background: var(--node-y2); }
        .y3 { background: var(--node-y3); }

        /* تأثيرات العقد عند التفاعل */
        .node-dimmed { opacity: 0.15; filter: grayscale(100%); pointer-events: none; }
        .node-highlighted { transform: scale(1.1); box-shadow: 0 0 0 4px rgba(209, 170, 92, 0.4); border-color: var(--gold); z-index: 60; opacity: 1;}
        .node-active { transform: scale(1.15) translateY(-5px); box-shadow: 0 0 0 4px var(--gold), 0 15px 30px rgba(0,0,0,0.4); border-color: #fff; z-index: 70; opacity: 1;}

        /* أزرار الزووم */
        .zoom-controls { position: fixed; bottom: 30px; left: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 500; }
        .zoom-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--navy); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.2s; }
        .zoom-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold);}

        /* Modal */
        #detailsModal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 10px 50px rgba(0,0,0,0.2); border: 1px solid var(--card-border); z-index: 2000; display: none; width: 320px; color: var(--ink); text-align: center; }
        #modalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1999; display: none; }
        .modal-btn { margin-top: 20px; width: 100%; padding: 12px; background: var(--navy); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .modal-btn:hover { background: var(--gold); }
        .req-box { background: var(--paper); border-radius: 8px; padding: 10px; margin-top: 15px; border: 1px dashed var(--card-border); font-size: 12px; font-weight: 600; text-align: right;}
        .req-title { color: var(--purple); font-size: 11px; margin-bottom: 5px; display: block;}
    </style>
</head>
<body>

    <header class="topbar">
      <div class="navrow">
        <a href="index.html" class="brand">
          <img src="logo.jpeg" class="brand-logo" alt="شعار" /> 
          <span>المنصة الأكاديمية</span>
        </a>
        <button class="back-btn" onclick="window.history.back()"><i data-lucide="arrow-left" width="20"></i></button>
      </div>
    </header>

    <div class="page-header">
        <h1>الخطة الشجرية التفاعلية</h1>
        <p>تخصص الطب والجراحة البيطرية - اضغط على أي مادة لرؤية مسارها بوضوح (خطة 1985)</p>
        
        <div class="controls-row">
            <div class="legend">
                <div class="legend-item"><div class="legend-line"></div> متطلب سابق</div>
                <div class="legend-item"><div class="legend-line dashed"></div> متطلب متزامن</div>
            </div>
            <button class="reset-btn" id="resetHighlightBtn" onclick="resetInteractive()"><i data-lucide="refresh-cw" width="14"></i> إلغاء التحديد</button>
        </div>
    </div>

    <!-- حاوية السحب والزوم -->
    <div class="map-container" id="mapContainer">
        <div class="tree-scale-wrapper" id="treeScale">
            <svg id="svg-lines"></svg>
            
            <div class="year-label yl-1">السنة الأولى</div>
            <div class="year-label yl-2">السنة الثانية</div>
            <div class="year-label yl-3">السنة الثالثة</div>

            <div id="nodes-container"></div>
        </div>
    </div>

    <!-- أزرار الزووم -->
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="adjustZoom(0.15)" title="تكبير"><i data-lucide="zoom-in" width="20"></i></button>
        <button class="zoom-btn" onclick="resetZoom()" title="ملاءمة الشاشة"><i data-lucide="maximize" width="20"></i></button>
        <button class="zoom-btn" onclick="adjustZoom(-0.15)" title="تصغير"><i data-lucide="zoom-out" width="20"></i></button>
    </div>

    <!-- نافذة التفاصيل -->
    <div id="modalOverlay" onclick="closeModal()"></div>
    <div id="detailsModal">
        <h3 id="m_title" style="margin-top:0; color:var(--navy);"></h3>
        <p style="font-size:14px; color:var(--slate); margin-bottom: 10px;">الرمز: <strong id="m_code" style="color:var(--purple);"></strong></p>
        <div class="req-box">
            <span class="req-title">المتطلبات:</span>
            <div id="m_reqs" style="line-height: 1.6;"></div>
        </div>
        <button class="modal-btn" onclick="closeModal()">حسناً، فهمت</button>

            { id: 'c374', code: '374 طب', name: 'تاريخ الحالة والفحص السريري', year: 3, pre: [], co: ['c372'], x: 1000, y: 950 },
            { id: 'c300', code: '300 طب', name: 'التطبيق السريري والمفاهيم', year: 3, pre: ['c342', 'c352', 'c372'], co: [], x: 1150, y: 950 }
        ];

        // ----------------- بناء الشجرة -----------------
        const container = document.getElementById('nodes-container');
        const svg = document.getElementById('svg-lines');

        coursesData.forEach(c => {
            const div = document.createElement('div');
            div.className = `course-node y${c.year}`;
            div.id = c.id;
            div.style.left = c.x + 'px';
            div.style.top = c.y + 'px';
            div.innerHTML = `<div class="course-code">${c.code}</div>${c.name}`;
            div.onclick = () => activateInteractivePath(c.id);
            container.appendChild(div);
        });

        function drawAllLines() {
            svg.innerHTML = '';
            setupMarkers();
            coursesData.forEach(course => {
                course.pre.forEach(preId => createLine(preId, course.id, false, `${preId}-${course.id}`));
                course.co.forEach(coId => createLine(coId, course.id, true, `${coId}-${course.id}`));
            });
        }

        function createLine(id1, id2, isDashed, lineId) {
            const el1 = document.getElementById(id1);
            const el2 = document.getElementById(id2);
            if (!el1 || !el2) return;

            const x1 = el1.offsetLeft + (el1.offsetWidth / 2);
            const y1 = el1.offsetTop + el1.offsetHeight;
            const x2 = el2.offsetLeft + (el2.offsetWidth / 2);
            const y2 = el2.offsetTop;

            const ctrlY = (y1 + y2) / 2;
            const pathData = `M ${x1} ${y1} C ${x1} ${ctrlY}, ${x2} ${ctrlY}, ${x2} ${y2}`;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', pathData);
            path.setAttribute('id', `line-${lineId}`);
            path.setAttribute('data-source', id1);
            path.setAttribute('data-target', id2);
            
            path.setAttribute('stroke', isDashed ? 'var(--tree-line-dashed)' : 'var(--tree-line)');
            path.setAttribute('stroke-width', '1.5');
            path.setAttribute('fill', 'none');
            if (isDashed) path.setAttribute('stroke-dasharray', '4,4');
            
            const markerId = isDashed ? 'arrowDashed' : 'arrowSolid';
            path.setAttribute('marker-end', `url(#${markerId})`);

            svg.appendChild(path);
        }

        function setupMarkers() {
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const colorSolid = getComputedStyle(document.documentElement).getPropertyValue('--tree-line').trim();
            const colorDashed = getComputedStyle(document.documentElement).getPropertyValue('--tree-line-dashed').trim();
            const colorGold = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim();

            const createM = (id, color) => {
                const m = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                m.setAttribute('id', id); m.setAttribute('viewBox', '0 0 10 10');
                m.setAttribute('refX', '5'); m.setAttribute('refY', '5');
                m.setAttribute('markerWidth', '6'); m.setAttribute('markerHeight', '6');
                m.setAttribute('orient', 'auto-start-reverse');
                m.innerHTML = `<path d="M 0 0 L 10 5 L 0 10 z" fill="${color}" />`;
                return m;
            };

            defs.appendChild(createM('arrowSolid', colorSolid));
            defs.appendChild(createM('arrowDashed', colorDashed));
            defs.appendChild(createM('arrowGold', colorGold));
            svg.appendChild(defs);
        }

        // ----------------- التفاعل السحري (Interactive Path) -----------------
        let isInteractiveMode = false;

        function getCourseById(id) { return coursesData.find(c => c.id === id); }

        function getAllPreReqs(courseId, resultSet = new Set(), edgesSet = new Set()) {
            const course = getCourseById(courseId);
            if(!course) return;

            course.pre.forEach(preId => {
                if(!resultSet.has(preId)) {
                    resultSet.add(preId);
                    edgesSet.add(`${preId}-${courseId}`);
                    getAllPreReqs(preId, resultSet, edgesSet);
                }
            });
            course.co.forEach(coId => {
                if(!resultSet.has(coId)) {
                    resultSet.add(coId);
                    edgesSet.add(`${coId}-${courseId}`);
                    getAllPreReqs(coId, resultSet, edgesSet);
                }
            });
            return { nodes: Array.from(resultSet), edges: Array.from(edgesSet) };
        }

        function activateInteractivePath(clickedId) {
            isInteractiveMode = true;
            document.getElementById('resetHighlightBtn').style.display = 'flex';
            
            const reqs = getAllPreReqs(clickedId);
            const activeNodes = [clickedId, ...reqs.nodes];
            const activeEdges = reqs.edges;

            document.querySelectorAll('.course-node').forEach(node => {
                node.classList.remove('node-active', 'node-highlighted', 'node-dimmed');
                if (node.id === clickedId) node.classList.add('node-active');
                else if (activeNodes.includes(node.id)) node.classList.add('node-highlighted');
                else node.classList.add('node-dimmed');
            });

            document.querySelectorAll('#svg-lines path').forEach(path => {
                path.classList.remove('path-highlighted', 'path-dimmed');
                const src = path.getAttribute('data-source');
                const tgt = path.getAttribute('data-target');
                
                if (activeEdges.includes(`${src}-${tgt}`)) {
                    path.classList.add('path-highlighted');
                    path.setAttribute('marker-end', 'url(#arrowGold)');
                } else {
                    path.classList.add('path-dimmed');
                    const isDashed = path.getAttribute('stroke-dasharray');
                    path.setAttribute('marker-end', `url(#${isDashed ? 'arrowDashed' : 'arrowSolid'})`);
                }
            });

            showDetailsModal(clickedId);
        }

        function resetInteractive() {
            isInteractiveMode = false;
            document.getElementById('resetHighlightBtn').style.display = 'none';
            
            document.querySelectorAll('.course-node').forEach(node => {
                node.classList.remove('node-active', 'node-highlighted', 'node-dimmed');
            });

            document.querySelectorAll('#svg-lines path').forEach(path => {
                path.classList.remove('path-highlighted', 'path-dimmed');
                const isDashed = path.getAttribute('stroke-dasharray');
                path.setAttribute('marker-end', `url(#${isDashed ? 'arrowDashed' : 'arrowSolid'})`);
            });
        }

        function showDetailsModal(id) {
            const course = getCourseById(id);
            document.getElementById('m_title').innerText = course.name;
            document.getElementById('m_code').innerText = course.code;
            
            let reqsHTML = '';
            if(course.pre.length === 0 && course.co.length === 0) reqsHTML = '<span style="color:var(--slate);">لا يوجد متطلبات</span>';
            
            course.pre.forEach(pid => { reqsHTML += `<div style="color:#dc2626; margin-bottom:4px;">سابق: ${getCourseById(pid).name}</div>`; });
            course.co.forEach(cid => { reqsHTML += `<div style="color:#d97706; margin-bottom:4px;">متزامن: ${getCourseById(cid).name}</div>`; });

            document.getElementById('m_reqs').innerHTML = reqsHTML;
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('detailsModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('detailsModal').style.display = 'none';
        }

        // ----------------- Pan & Zoom -----------------
        const scaleWrapper = document.getElementById('treeScale');
        const mapContainer = document.getElementById('mapContainer');
        let currentZoom = 1;

        function adjustZoom(step) {
            currentZoom += step;
            if (currentZoom < 0.25) currentZoom = 0.25;
            if (currentZoom > 2.5) currentZoom = 2.5;
            scaleWrapper.style.transform = `scale(${currentZoom})`;
        }

        function resetZoom() {
            const w = window.innerWidth;
            if (w < 600) currentZoom = 0.35;
            else if (w < 1000) currentZoom = 0.55;
            else currentZoom = 0.85;
            scaleWrapper.style.transform = `scale(${currentZoom})`;
            
            // تمرير لليمين عند فتح الصفحة عشان الطالب يبدأ من السنة الأولى
            setTimeout(() => { mapContainer.scrollLeft = mapContainer.scrollWidth; }, 300);
        }

        let isDragging = false, startX, startY, scrollLeft, scrollTop;
        mapContainer.addEventListener('mousedown', (e) => { isDragging = true; startX = e.pageX - mapContainer.offsetLeft; startY = e.pageY - mapContainer.offsetTop; scrollLeft = mapContainer.scrollLeft; scrollTop = mapContainer.scrollTop; });
        mapContainer.addEventListener('mouseleave', () => { isDragging = false; });
        mapContainer.addEventListener('mouseup', () => { isDragging = false; });
        mapContainer.addEventListener('mousemove', (e) => { if (!isDragging) return; e.preventDefault(); const x = e.pageX - mapContainer.offsetLeft; const y = e.pageY - mapContainer.offsetTop; mapContainer.scrollLeft = scrollLeft - (x - startX) * 1.5; mapContainer.scrollTop = scrollTop - (y - startY) * 1.5; });

        window.addEventListener('load', () => {
            drawAllLines();
            resetZoom();
        });

        lucide.createIcons();
    </script>
</body>
</html>
