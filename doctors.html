<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b33" />
    <title>أعضاء هيئة التدريس | VetCommitto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <style>
        :root {
            --navy: #0d1b33; --purple: #1e3f70; --gold: #d1aa5c; --slate: #606d85;
            --paper: #f5f7fa; --card-bg: #fff; --card-border: #dfe3ed;
            --nav-bg: #fbfbfd; --nav-border: #e8eaf1; --ink: #1a2233;
            --btn-bg: #f0f3f7; --btn-hover: #eef1f6; --line: #e2e6ed;
        }

        [data-theme="dark"] {
            --navy: #e0e5ed; --purple: #8baccf; --paper: #0b1120;
            --card-bg: #1e293b; --card-border: #334155; --nav-bg: #0f172a; --nav-border: #1e293b; --ink: #e0e5ed;
            --btn-bg: #334155; --btn-hover: #475569; --line: #334155;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans Arabic", sans-serif; transition: background 0.3s, color 0.3s; padding-bottom: 60px;}
        a { color: inherit; text-decoration: none; }
        button, input, select { font: inherit; }
        
        .wrap { width: min(1000px, calc(100% - 40px)); margin-inline: auto; }

        .topbar { height: 70px; background: var(--nav-bg); border-bottom: 1px solid var(--nav-border); display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; transition: 0.3s;}
        .navrow { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 20px;}
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--navy); }
        .brand-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); }
        .back-btn { width: 40px; height: 40px; border: 1px solid var(--card-border); background: var(--card-bg); border-radius: 12px; display: grid; place-items: center; color: var(--navy); transition: 0.2s; cursor: pointer;}
        .back-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold);}

        .page-header { text-align: center; padding: 40px 0 30px; }
        .page-kicker { font-size: 12px; color: var(--purple); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        .page-header h1 { color: var(--navy); font-size: 28px; margin: 0 0 10px; font-weight: 800; line-height: 1.4; }
        .page-header p { color: var(--slate); font-size: 15px; margin: 0; max-width: 600px; margin-inline: auto; line-height: 1.6;}

        /* Controls: Search & Filter */
        .controls { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--slate); }
        .field { width: 100%; border: 1px solid var(--card-border); background: var(--card-bg); padding: 14px 45px 14px 15px; border-radius: 12px; outline: none; color: var(--ink); font-size: 14px; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.02);}
        .field:focus { border-color: var(--purple); }
        .filter-sel { flex: none; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--navy); border-radius: 12px; padding: 14px 20px; font-size: 14px; font-weight: 600; outline: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.02); min-width: 220px;}

        /* Doctors Grid */
        .doctors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .doc-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); display: flex; flex-direction: column; transition: 0.3s; position: relative; overflow: hidden;}
        .doc-card:hover { border-color: var(--purple); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06);}
        .doc-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gold); opacity: 0; transition: 0.3s;}
        .doc-card:hover::before { opacity: 1; }
        
        .doc-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .doc-avatar { width: 50px; height: 50px; border-radius: 14px; background: var(--btn-bg); color: var(--purple); display: grid; place-items: center; flex: none; font-size: 20px; font-weight: 800; font-family: Manrope, sans-serif;}
        .doc-info { flex: 1; min-width: 0; }
        .doc-name { margin: 0 0 4px; font-size: 16px; font-weight: 700; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .doc-title { margin: 0; font-size: 12px; color: var(--slate); font-weight: 600; }
        
        .doc-dept { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--purple); background: var(--btn-bg); padding: 6px 12px; border-radius: 8px; margin-bottom: 20px; width: fit-content; }
        
        .doc-actions { display: flex; gap: 10px; margin-top: auto; border-top: 1px solid var(--line); padding-top: 15px;}
        .btn-mail { flex: 1; background: var(--purple); color: #fff; border: none; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s;}
        .btn-mail:hover { opacity: 0.9; transform: translateY(-2px);}
        .btn-copy { flex: 1; background: var(--card-bg); color: var(--navy); border: 1px solid var(--card-border); padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s;}
        .btn-copy:hover { background: var(--btn-bg); border-color: var(--purple); color: var(--purple);}

        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 3000; animation: toast-in 0.3s forwards, toast-out 0.3s 3s forwards; }
        @keyframes toast-in { from { opacity:0; bottom: 0; } to { opacity:1; bottom: 20px; } }
        @keyframes toast-out { to { opacity:0; bottom: -20px; } }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--slate); font-size: 15px; }

        @media (max-width: 600px) {
            .page-header h1 { font-size: 24px; }
            .filter-sel { width: 100%; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="navrow">
            <a href="index.html" class="brand">
                <img src="logo.jpeg" class="brand-logo" alt="شعار" /> 
                <span>المنصة الأكاديمية</span>
            </a>
            <button class="back-btn" onclick="window.history.back()"><i data-lucide="arrow-left" width="20"></i></button>
        </div>
    </header>

    <main class="wrap">
        <div class="page-header">
            <span class="page-kicker">تواصل مع كليتك</span>
            <h1>أعضاء هيئة التدريس</h1>
            <p>دليل شامل للبريد الإلكتروني لأعضاء هيئة التدريس في كلية الطب البيطري مرتبة حسب الأقسام الأكاديمية.</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <i data-lucide="search" width="18"></i>
                <input type="text" id="searchInput" class="field" placeholder="ابحث عن دكتور بالاسم..." />
            </div>
            <select id="deptFilter" class="filter-sel">
                <option value="all">جميع الأقسام</option>
                <option value="العلوم الطبية البيطرية الأساسية">قسم العلوم الأساسية</option>
                <option value="علم الأمراض البيطرية والصحة العامة">قسم علم الأمراض والصحة العامة</option>
                <option value="العلوم الطبية البيطرية الإكلينيكية">القسم الإكلينيكي</option>
            </select>
        </div>

        <div class="doctors-grid" id="doctorsGrid">
            <!-- سيتم توليد البطاقات هنا بواسطة الجافاسكربت -->
        </div>
    </main>

    <script>
        const isDark = localStorage.getItem("vet_theme") === "dark";
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");

        // قاعدة بيانات الدكاترة بالطريقة الجديدة (الآمنة والمختصرة)
        const DEPTS = {  
            b: "العلوم الطبية البيطرية الأساسية",  
            p: "علم الأمراض البيطرية والصحة العامة",  
            c: "العلوم الطبية البيطرية الإكلينيكية"
        };
        
        const RAW = `
b|ابراهيم الزهير|رئيس قسم - استاذ مشارك|imalzuheir
b|احمد المجالي|استاذ|almajali
b|ايهاب ابو باشا|استاذ|abubasha
b|فلاح شديفات|استاذ|falah
b|محمد برهان الزغول|استاذ|alzghoul
b|محمد غرايبه|استاذ|mhgharaibeh
b|محمد خليفه|استاذ|mskn
b|مصطفى عبابنه|استاذ|ababnem
b|رامي مقبل|استاذ|rmmukbel
b|محمد السبع|استاذ مشارك|mnalsabi
b|انس المخزومي|استاذ مساعد|akalmakhzoomil
b|عبد الرحمن نصر|محاضر متفرغ|atnasr
b|جهينه عبابنه|محاضر متفرغ|oaababneh0
b|علا عبابنه|محاضر متفرغ|jsababneh
b|سيف هندم|محاضر متفرغ|sfhundam
p|عبد المجيد العجلوني|رئيس قسم - استاذ مساعد|amalajlouni
p|مفلح عواوده|استاذ|mawawdeh
p|محمد عبيدات|استاذ|mmobaidat
p|محمد الناطور|استاذ|alnatour
p|نبيل هيلات|استاذ|hailatn
p|رائده الرقيبات|استاذ|ralrukib
p|سعد غرايبه|استاذ|saadgh
p|شوكت هيلات|استاذ|shqalafi
p|وائل حننه|استاذ|whananeh
p|عمر الحسين|استاذ مساعد|oshusan
p|فاطمه غباري|محاضر متفرغ|frghbari
p|اسماعيل ملكاوي|محاضر متفرغ|immalkawi0
p|شيرين الخلوف|محاضر متفرغ|smalkhlouf
c|احمد شرشر|رئيس قسم - استاذ|amsharshar
c|عبد السلام طلافحه|استاذ|talafha
c|عبد الحكيم الجراح|استاذ|eljarah
c|امين طاحون|استاذ|amtahoun
c|حسين محمد|استاذ|hamohamed
c|خالد القضاه|استاذ|alqudah
c|محمد عبابنه|استاذ|ababneh
c|صبري شحاته|استاذ|sashehata
c|سميح ابوطربوش|استاذ|smabutarbush
c|زهير بني اسماعيل|استاذ|zuhair72
c|ميسر العكش|استاذ مشارك|moalekish
c|مروه حسين|استاذ مشارك|mhhussein
c|موسى درادكه|استاذ مشارك|daradka
c|سمر عطوه|استاذ مشارك|smatwa
c|ميس ملكاوي|استاذ مساعد|mamalkawi71
c|محمد سالم|استاذ مساعد|mgsalem
c|اكرم الغزو|محاضر متفرغ|aaalguzo9
c|عامر الجراح|محاضر متفرغ|aaaljarrah7
c|حسن العمري|مدرس|hyalomari
`;

        const doctorsData = RAW.split("\n")
          .map(l => l.trim())
          .filter(Boolean)
          .map(l => {
            const [d, name, title, mail] = l.split("|").map(x => x.trim());
            return { name, title, email: mail + "@just.edu.jo", department: DEPTS[d] };
          });

        const grid = document.getElementById('doctorsGrid');
        const searchInput = document.getElementById('searchInput');
        const deptFilter = document.getElementById('deptFilter');

        function renderDoctors() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const dept = deptFilter.value;

            const filtered = doctorsData.filter(doc => {
                const matchesSearch = doc.name.toLowerCase().includes(searchTerm) || doc.email.toLowerCase().includes(searchTerm);
                const matchesDept = dept === "all" || doc.department === dept;
                return matchesSearch && matchesDept;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">لا يوجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(doc => {
                const initials = doc.name.substring(0, 2).trim();
                
                return `
                <article class="doc-card">
                    <div class="doc-header">
                        <div class="doc-avatar">${initials}</div>
                        <div class="doc-info">
                            <h3 class="doc-name">د. ${doc.name}</h3>
                            <p class="doc-title">${doc.title}</p>
                        </div>
                    </div>
                    <span class="doc-dept"><i data-lucide="building-2" width="14"></i>${doc.department}</span>
                    <div class="doc-actions">
                        <a href="mailto:${doc.email}" class="btn-mail"><i data-lucide="mail" width="16"></i>مراسلة</a>
                        <button class="btn-copy" onclick="copyEmail('${doc.email}')"><i data-lucide="copy" width="16"></i>نسخ</button>
                    </div>
                </article>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        window.copyEmail = function(email) {
            navigator.clipboard.writeText(email).then(() => {
                showToast("تم نسخ البريد الإلكتروني: " + email);
            });
        };

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const t = document.createElement("div"); 
            t.className = "toast";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        searchInput.addEventListener('input', renderDoctors);
        deptFilter.addEventListener('change', renderDoctors);

        // Render initially
        renderDoctors();

    </script>
    
    <!-- كود تسجيل الـ Service Worker (الأوفلاين) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(registration => console.log('ServiceWorker registered!'))
            .catch(err => console.log('ServiceWorker failed: ', err));
        });
      }
    </script>
</body>
</html>
