<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b33">
<title>خريطة حرم التكنو 3D | VetCommitto</title>
<link rel="icon" href="logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b33;--navy-2:#173461;--ink:#142033;--slate:#5c6b82;
  --line:#dfe5ef;--gold:#d1aa5c;--gold-hi:#f4dca4;--card:rgba(255,255,255,.94);
  --card-solid:#ffffff;--card-2:#f4f7fb;--btn:#eef2f8;--nav:rgba(251,252,254,.92);
  --h:62px;--sheet-peek:56px;--shadow:0 12px 34px rgba(13,27,51,.16);
}
[data-theme=dark]{
  --navy:#e8edf5;--navy-2:#9bb7de;--ink:#e8edf5;--slate:#95a4bc;
  --line:#28374e;--card:rgba(16,27,46,.92);--card-solid:#121f35;--card-2:#0d1729;
  --btn:#1e2f4a;--nav:rgba(11,20,36,.92);--shadow:0 14px 38px rgba(0,0,0,.46);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;touch-action:none}
body{background:#c5e1f5;color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
[data-theme=dark] body{background:#0b1526}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hid{display:none!important}

/* الهيدر العلوي */
.top{
  position:fixed;top:0;inset-inline:0;height:var(--h);z-index:25;
  background:var(--nav);border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#0d1b33;flex:none}
.brand b{display:block;font-size:13.5px;color:var(--navy);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:10px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.ib{
  height:36px;min-width:36px;padding:0 11px;border-radius:11px;border:1px solid var(--line);
  background:var(--card-solid);color:var(--navy);font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.15s;
}
.ib:hover{border-color:var(--gold)}
.ib.vet-pill{background:#0d1b33;color:var(--gold-hi);border-color:var(--gold)}

/* مسرح الـ 3D والليبلات */
#sceneWrap{position:fixed;top:var(--h);left:0;right:0;bottom:0;overflow:hidden}
#c3d{display:block;width:100%;height:100%;outline:none}
#labelsLayer{position:fixed;top:var(--h);left:0;right:0;bottom:0;pointer-events:none;z-index:6;overflow:hidden}

.lbl3d{
  position:absolute;top:0;left:0;pointer-events:auto;
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 5px;
  border-radius:999px;border:1.5px solid rgba(255,255,255,.94);
  background:rgba(255,255,255,.94);color:#0d1b33;
  box-shadow:0 6px 18px rgba(13,27,51,.22);
  font:700 10.5px/1.2 "IBM Plex Sans Arabic",sans-serif;white-space:nowrap;
  transform:translate(-50%,-100%);transition:opacity .2s;will-change:transform;
}
[data-theme=dark] .lbl3d{
  background:rgba(15,27,48,.92);color:#f1f5f9;border-color:rgba(209,170,92,.45);
}
.lbl3d .lc{
  padding:2px 6px;border-radius:999px;background:var(--pc,#0d1b33);color:#fff;
  font:800 9.5px/1 Manrope,sans-serif;direction:ltr;
}
.lbl3d.vet{
  background:#0d1b33;color:#fff;border:2px solid var(--gold);padding:4px 10px 4px 6px;
  font-size:11.5px;box-shadow:0 8px 24px rgba(13,27,51,.4);z-index:8;
}
.lbl3d.vet .lc{background:var(--gold);color:#0b1526}
.lbl3d.sel{border-color:var(--gold);z-index:12;box-shadow:0 10px 26px rgba(209,170,92,.45)}

/* البحث والفلاتر */
.hud-top{
  position:fixed;z-index:15;top:calc(var(--h) + 10px);inset-inline:12px;
  display:flex;flex-direction:column;gap:7px;pointer-events:none;max-width:680px;
}
.hud-top>*{pointer-events:auto}
.sb{position:relative;width:100%;max-width:410px}
.sb input{
  width:100%;height:42px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:14px;padding:0 38px 0 14px;font-size:13px;box-shadow:var(--shadow);
}
.sb input:focus{outline:2.5px solid var(--gold);outline-offset:1px}
.sb-ico{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--slate);pointer-events:none;display:grid;place-items:center}
.res{
  position:absolute;top:48px;inset-inline:0;background:var(--card-solid);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 18px 42px rgba(13,27,51,.24);overflow:auto;max-height:48vh;
  list-style:none;margin:0;padding:4px;z-index:35;
}
.res li button{
  display:flex;width:100%;gap:9px;align-items:center;border:0;background:transparent;color:var(--ink);
  padding:8px 10px;border-radius:10px;text-align:start;font-size:12.5px;
}
.res li button:hover{background:var(--btn)}
.res .rc{
  min-width:42px;padding:3px 6px;border-radius:7px;color:#fff;
  font:800 10.5px Manrope,sans-serif;text-align:center;direction:ltr;flex:none;
}
.res .rm{display:flex;flex-direction:column;min-width:0;flex:1}
.res .rm b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rm span{font-size:10.5px;color:var(--slate)}

.cat-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-pill{
  flex:none;display:inline-flex;align-items:center;gap:5px;height:33px;padding:0 11px;
  border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:11.5px;font-weight:700;box-shadow:0 5px 15px rgba(13,27,51,.12);transition:.15s;
}
.cat-pill .cd{width:8px;height:8px;border-radius:50%;flex:none}
.cat-pill small{font:700 10px Manrope,sans-serif;opacity:.65}
.cat-pill.on{background:#0d1b33;color:#fff;border-color:var(--gold)}
.cat-pill.on small{color:var(--gold-hi);opacity:1}

/* شريط التحكم الجانبي */
.ctrl-stack{
  position:fixed;z-index:15;left:12px;top:50%;transform:translateY(-44%);
  display:flex;flex-direction:column;gap:6px;
}
.ctrl-btn{
  width:42px;height:42px;border-radius:13px;border:1px solid var(--line);
  background:var(--card);color:var(--navy);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:grid;place-items:center;font-size:13px;font-weight:800;
  box-shadow:var(--shadow);transition:.15s;
}
.ctrl-btn:hover{border-color:var(--gold);transform:scale(1.04)}
.ctrl-btn.on{background:#0d1b33;color:var(--gold-hi);border-color:var(--gold)}
.ctrl-btn svg{transition:transform .2s}

/* بطاقة تفاصيل المبنى */
.info-card{
  position:fixed;z-index:20;inset-inline:12px;
  bottom:calc(var(--sheet-peek) + 12px + env(safe-area-inset-bottom,0px));
  max-width:400px;background:var(--card-solid);border:1.5px solid var(--gold);
  border-radius:22px;padding:16px;box-shadow:0 24px 60px rgba(13,27,51,.34);
  animation:cardIn .22s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ic-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ic-badges{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.ic-code{padding:3px 9px;border-radius:8px;color:#fff;font:800 12px Manrope,sans-serif;direction:ltr}
.ic-cat{padding:3px 9px;border-radius:8px;background:var(--btn);color:var(--navy);font-size:11px;font-weight:700}
.ic-close{
  width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
  background:var(--btn);color:var(--navy);display:grid;place-items:center;font-size:16px;flex:none;
}
.info-card h2{margin:0;font-size:17px;color:var(--navy);line-height:1.3}
.info-card .en{font:600 11.5px Manrope,sans-serif;color:var(--slate);direction:ltr;text-align:start;margin-top:2px}
.ic-sec{margin-top:11px;padding:10px 12px;border-radius:14px;background:var(--card-2);border:1px solid var(--line)}
.ic-sec h4{margin:0 0 6px;font-size:11.5px;color:var(--slate);font-weight:700}
.ic-sec ul{margin:0;padding:0 16px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink)}
.ic-actions{display:flex;gap:8px;margin-top:12px}
.pb{
  flex:1;border:0;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.pb.navy{background:#0d1b33;color:#fff}
.pb.gold{background:var(--gold);color:#0b1526}

/* الدليل السفلي */
.sheet{
  position:fixed;z-index:18;inset-inline:0;bottom:0;
  background:var(--card-solid);border-top:1.5px solid var(--line);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 38px rgba(13,27,51,.18);
  height:calc(var(--sheet-peek) + env(safe-area-inset-bottom,0px));
  transition:height .28s cubic-bezier(.22,.85,.28,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet.open{height:min(66vh,540px)}
.sheet-head{
  flex:none;padding:7px 16px 9px;display:flex;flex-direction:column;align-items:center;
  gap:5px;cursor:pointer;user-select:none;border-bottom:1px solid transparent;
}
.sheet.open .sheet-head{border-bottom-color:var(--line)}
.sheet-handle{width:38px;height:4px;border-radius:999px;background:var(--line)}
.sheet-title-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-title-row b{font-size:13px;color:var(--navy)}
.sheet-title-row span{font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--btn);color:var(--navy)}
.sheet-areas{
  flex:none;display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;background:var(--card-2);
}
.sheet-areas::-webkit-scrollbar{display:none}
.area-tab{
  flex:none;padding:5px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card-solid);color:var(--slate);font-size:11.5px;font-weight:700;
}
.area-tab.on{background:#0d1b33;color:var(--gold-hi);border-color:#0d1b33}
.sheet-body{flex:1;overflow-y:auto;padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px}
.dir-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:start;
  padding:9px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);
  color:var(--ink);transition:.15s;
}
.dir-item:hover{border-color:var(--gold);transform:translateY(-1px)}
.dir-code{
  min-width:44px;height:32px;padding:0 6px;border-radius:10px;color:#fff;
  display:grid;place-items:center;font:800 11px Manrope,sans-serif;direction:ltr;flex:none;
}
.dir-info{min-width:0;flex:1}
.dir-info b{display:block;font-size:12.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-info small{display:block;font-size:10.5px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-src{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--slate);text-align:center}

.loader{
  position:fixed;inset:0;z-index:50;background:#0d1b33;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  transition:opacity .45s ease;
}
.loader.done{opacity:0;pointer-events:none}
.loader-spin{
  width:42px;height:42px;border-radius:50%;border:3px solid rgba(209,170,92,.25);
  border-top-color:var(--gold);animation:sp .85s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.loader b{font-size:15px;color:var(--gold-hi)}
.loader small{font-size:12px;color:#9eb3cf}

.toast{
  position:fixed;z-index:45;top:calc(var(--h) + 12px);left:50%;transform:translateX(-50%);
  background:#0d1b33;color:#fff;border:1px solid rgba(209,170,92,.5);padding:8px 16px;
  border-radius:12px;font-size:12.5px;box-shadow:0 12px 30px rgba(0,0,0,.3);pointer-events:none;
}

@media(min-width:780px){
  .info-card{inset-inline-start:16px;inset-inline-end:auto;width:360px}
  .sheet{max-width:760px;margin-inline:auto;border-inline:1px solid var(--line)}
}
@media(max-width:520px){
  .brand small{display:none}
  .ib.hide-xs{display:none}
  .ctrl-stack{left:8px;gap:5px}
  .ctrl-btn{width:38px;height:38px;border-radius:11px;font-size:12px}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-spin"></div>
  <b>جاري بناء مجسّم حرم التكنو 3D...</b>
  <small>الشبكة القطرية الكاملة ومعالم الجامعة الحقيقية · VetCommitto</small>
</div>

<header class="top">
  <a class="brand" href="index.html">
    <img src="logo.jpeg" alt="شعار VetCommitto" onerror="this.style.display='none'">
    <span><b>خريطة حرم التكنو 3D</b><small>جامعة العلوم والتكنولوجيا الأردنية · VetCommitto</small></span>
  </a>
  <div class="tools">
    <button class="ib vet-pill" id="jumpG1" type="button" title="كلية الطب البيطري">G1 البيطري</button>
    <button class="ib vet-pill" id="jumpVH" type="button" title="المستشفى البيطري">V.H المستشفى</button>
    <a class="ib hide-xs" href="index.html">المنصة</a>
    <button class="ib" id="thBtn" type="button" aria-label="تبديل المظهر">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div id="sceneWrap"><canvas id="c3d"></canvas></div>
<div id="labelsLayer" aria-hidden="true"></div>
<div id="errBox" class="hid" style="position:fixed;top:74px;left:12px;right:12px;z-index:99;background:#7f1d1d;color:#fff;padding:12px 14px;border-radius:12px;font:12px/1.6 monospace;direction:ltr;white-space:pre-wrap"></div>

<!-- البحث والفلاتر -->
<div class="hud-top">
  <div class="sb">
    <span class="sb-ico" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </span>
    <input id="q" type="search" placeholder="ابحث عن كلية، مدرج، أو كود (G1، V.H، 410، البحيرة)..." autocomplete="off" aria-label="بحث">
    <ul class="res hid" id="res"></ul>
  </div>
  <div class="cat-bar" id="catBar" role="tablist"></div>
</div>

<!-- شريط التحكم الجانبي -->
<div class="ctrl-stack" aria-label="أدوات الخريطة">
  <button class="ctrl-btn" id="btnZoomIn" type="button" title="تكبير">+</button>
  <button class="ctrl-btn" id="btnZoomOut" type="button" title="تصغير">−</button>
  <button class="ctrl-btn" id="btnCompass" type="button" title="توجيه للشمال">
    <svg id="compassNeedle" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="12 2 15 12 12 10 9 12 12 2" fill="#dc2626" stroke="none"/>
      <polygon points="12 22 9 12 12 14 15 12 12 22" fill="currentColor" stroke="none" opacity="0.45"/>
      <circle cx="12" cy="12" r="9" opacity="0.35"/>
    </svg>
  </button>
  <button class="ctrl-btn" id="btn2D" type="button" title="عرض علوي 2D / ثلاثي الأبعاد 3D">2D</button>
  <button class="ctrl-btn on" id="btnLbl" type="button" title="إظهار / تخفيف الأسماء">أ</button>
  <button class="ctrl-btn" id="btnReset" type="button" title="نظرة شاملة للحرم">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
  <button class="ctrl-btn" id="btnFull" type="button" title="ملء الشاشة">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  </button>
</div>

<section class="info-card hid" id="infoCard" aria-live="polite"></section>

<aside class="sheet" id="dirSheet" aria-label="دليل مباني الجامعة">
  <div class="sheet-head" id="sheetToggle">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row">
      <b>دليل مباني ومعالم التكنو</b>
      <span id="dirCount">43 معلم</span>
    </div>
  </div>
  <div class="sheet-areas" id="areaTabs"></div>
  <div class="sheet-body">
    <div class="dir-grid" id="dirGrid"></div>
    <div class="dir-src">مجسّم معماري ثلاثي الأبعاد لحرم جامعة العلوم والتكنولوجيا الأردنية · VetCommitto</div>
  </div>
</aside>

<div class="toast hid" id="toast" role="status"></div>

<script>
window.__showErr = function (m) {
  var b = document.getElementById("errBox");
  if (!b) return;
  b.classList.remove("hid");
  b.textContent = (b.textContent ? b.textContent + "\n" : "") + m;
  var l = document.getElementById("loader");
  if (l) l.classList.add("done");
};
window.onerror = function (msg, src, line) {
  window.__showErr("ERR: " + msg + " (L" + line + ")");
};
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js" onerror="window.__showErr('تعذّر تحميل محرك Three.js من الإنترنت.')"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js" onerror="window.__showErr('تعذّر تحميل أداة التحكم OrbitControls.')"></script>
<script>
(function () {
  if (!window.THREE || !THREE.OrbitControls) {
    window.__showErr("تعذّر تشغيل محرك العرض 3D.");
    return;
  }

  var CATS = [
    { id: "college", ar: "الكليات", color: "#1e40af" },
    { id: "halls", ar: "القاعات والمدرجات", color: "#b45309" },
    { id: "health", ar: "الصحة والمستشفيات", color: "#dc2626" },
    { id: "admin", ar: "الإدارة", color: "#8b452f" },
    { id: "services", ar: "خدمات الطلبة", color: "#0284c7" },
    { id: "sport", ar: "الرياضة", color: "#15803d" },
    { id: "facilities", ar: "مرافق ومعالم", color: "#475569" }
  ];
  var AREAS = {
    all: "كل الحرم",
    engineering: "المباني الهندسية والبيطري",
    central: "الوسط",

     ===================================================== */
  function ribbonMesh(ctrl, width, height, capMat, sideMat, pid, yBase) {
    var curve = new THREE.CatmullRomCurve3(ctrl.map(function (p) { return new THREE.Vector3(p[0], 0, p[1]); }));
    var N = 32, L = [], R = [];
    for (var i = 0; i <= N; i++) {
      var t = i / N, p = curve.getPoint(t), tg = curve.getTangent(t), nx = -tg.z, nz = tg.x;
      var hw = width / 2;
      L.push([p.x + nx * hw, p.z + nz * hw]); R.push([p.x - nx * hw, p.z - nz * hw]);
    }
    return polyExtrude(L.concat(R.reverse()), height, [capMat, sideMat], yBase || 0, pid);
  }

    }
  }
  // صفوف السرو الكثيفة خلف البوابة وخلف المجمعين والبحيرة
  pRow(-98, -44, -17.0, 3.2);
  pRow(54, 94, -17.0, 3.4);
  pRow(-11, 12, 22.0, 2.4); // غابة السرو خلف البوابة الرئيسية (تظهر في الصورة الحقيقية!)
  pCl(72, -41, 8, 5); pCl(108, -40, 9, 5); pCl(134, -15, 10, 6);

  // أشجار الشارع الأمامي والشاطئ الغربي للبحيرة وحديقة المسجد
  lRow(-44, -18, 21.5, 4.6);
  lRow(18, 42, 21.5, 4.8);
  lRow(68, 138, 16.5, 4.2);
  // شاطئ البحيرة الغربي المائل
  for (var k = 0; k < 9; k++) leafCoords.push([105 + k * 1.4, 13 - k * 2.2]);
  // أشجار حول المسجد و 410 ومهبط الطائرات
  for (var m = 0; m < 10; m++) leafCoords.push([-40 + (rand() - 0.5) * 10, 8 + (rand() - 0.5) * 12]);
  for (var w = 0; w < 12; w++) leafCoords.push([-124 + (rand() - 0.5) * 14, -6 + (rand() - 0.5) * 8]);

  var trunkMat = M(0x5c422c, 0.92);
  var pineTrunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.14, 0.22, 1.2, 5), trunkMat, pineCoords.length);
  var pineCones = new THREE.InstancedMesh(new THREE.ConeGeometry(0.95, 4.8, 7), M(0x2b622e, 0.88), pineCoords.length);
  pineCones.castShadow = true;

  var dummy = new THREE.Object3D(), colTmp = new THREE.Color();
  for (var i = 0; i < pineCoords.length; i++) {
    var sP = 0.8 + rand() * 0.45;
    dummy.position.set(pineCoords[i][0], 0.6 * sP, pineCoords[i][1]); dummy.scale.set(sP, sP, sP); dummy.rotation.set(0, rand() * 3, 0); dummy.updateMatrix(); pineTrunks.setMatrixAt(i, dummy.matrix);
    dummy.position.set(pineCoords[i][0], 3.0 * sP, pineCoords[i][1]); dummy.updateMatrix(); pineCones.setMatrixAt(i, dummy.matrix);
    colTmp.setHex(i % 2 ? 0x285c2a : 0x356f34); pineCones.setColorAt(i, colTmp);
  }
  scene.add(pineTrunks, pineCones);

  var leafTrunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.22, 1.5, 6), trunkMat, leafCoords.length);
  var leafCrowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.25, 1), M(0x3f843a, 0.85), leafCoords.length);
  leafCrowns.castShadow = true;
  var leafCols = [0x357834, 0x458b3d, 0x4f9644, 0x2f6c2f];
  for (var li = 0; li < leafCoords.length; li++) {
    var sL = 0.78 + rand() * 0.35;
    dummy.position.set(leafCoords[li][0], 0.75 * sL, leafCoords[li][1]); dummy.scale.set(sL, sL, sL); dummy.rotation.set(0, rand() * 3, 0); dummy.updateMatrix(); leafTrunks.setMatrixAt(li, dummy.matrix);
    dummy.position.set(leafCoords[li][0], 2.2 * sL, leafCoords[li][1]); dummy.scale.set(sL * 1.08, sL * 0.92, sL * 1.08); dummy.updateMatrix(); leafCrowns.setMatrixAt(li, dummy.matrix);
    colTmp.setHex(leafCols[li % 4]); leafCrowns.setColorAt(li, colTmp);
  }
  scene.add(leafTrunks, leafCrowns);

  /* ---- مزامنة إحداثيات الليبلات مع المجسمات ---- */
  var LH = { "intl-relations": 7.2, "intl-students": 11, "research-deanship": 7.5, "farouq": 10.5, "graduate": 7.5, "library": 13.2, "student-affairs": 6.4, "vet-faculty": 12.2, "dentistry": 7.2, "hijazi-hall": 10.5, "science-arts": 7.0, "pharmacy": 10.5, "science-hall-1": 7.2, "medicine": 8.2 };
  PLACES.forEach(function (p) {
    var q = placePos[p.id];
    if (!q) return;
    p.x = q[0]; p.z = q[1]; p.w = q[2]; p.d = q[3]; p.h = q[4];
    if (LH[p.id]) p.lh = LH[p.id];
  });

  var selRing = new THREE.Mesh(
    new THREE.RingGeometry(1, 1.16, 40),
    new THREE.MeshBasicMaterial({ color: 0xf2d079, side: THREE.DoubleSide, transparent: true, opacity: 0.92 })
  );
  selRing.rotation.x = -Math.PI / 2;
  selRing.position.y = 0.5;
  selRing.visible = false;
  scene.add(selRing);

  /* =====================================================
     14. الليبلات العائمة + البطاقة + البحث + الفلاتر + التحكم
     ===================================================== */
  var labelsLayer = $("labelsLayer");
  var labelNodes = {};
  var labelMode = 1;
  var activeCat = "all";
  var activeArea = "all";
  var selectedId = null;

  PLACES.forEach(function (p) {
    var isVet = p.id === "vet-faculty" || p.id === "vet-hospital";
    var btn = mk("button", null, "lbl3d" + (isVet ? " vet" : ""));
    btn.type = "button";
    var codeSpan = mk("span", p.code, "lc");
    codeSpan.style.setProperty("--pc", p.color);
    btn.append(codeSpan, mk("span", p.ar));
    btn.onclick = function (e) { e.stopPropagation(); selectPlace(p.id, true); };
    labelsLayer.append(btn);
    labelNodes[p.id] = { el: btn, place: p };
  });

  var projVec = new THREE.Vector3();
  function updateLabels() {
    var w = wrap.clientWidth, h = wrap.clientHeight;
    var camDist = camera.position.distanceTo(controls.target);
    var placed = [];

    var ordered = PLACES.slice().sort(function (a, b) {
      var sa = (a.id === selectedId ? 0 : (a.id === "vet-faculty" || a.id === "vet-hospital" ? 1 : a.prio + 1));
      var sb = (b.id === selectedId ? 0 : (b.id === "vet-faculty" || b.id === "vet-hospital" ? 1 : b.prio + 1));
      return sa - sb;
    });

    for (var i = 0; i < ordered.length; i++) {
      var p = ordered[i];
      var el = labelNodes[p.id].el;
      var matchesCat = activeCat === "all" || p.cat === activeCat;

      if ((labelMode === 0 || !matchesCat) && p.id !== selectedId) { el.style.display = "none"; continue; }
      if (labelMode === 1 && activeCat === "all" && p.id !== selectedId) {
        if (p.prio === 3 && camDist > 105) { el.style.display = "none"; continue; }
        if (p.prio === 2 && camDist > 160) { el.style.display = "none"; continue; }
      }

      projVec.set(p.x, (p.lh || Math.max(p.h, 2)) + 2.4, p.z);
      projVec.project(camera);
      if (projVec.z > 1) { el.style.display = "none"; continue; }

      var sx = (projVec.x * 0.5 + 0.5) * w;
      var sy = (-projVec.y * 0.5 + 0.5) * h;
      if (sx < -40 || sx > w + 40 || sy < 15 || sy > h - 58) { el.style.display = "none"; continue; }

      var collide = false;
      if (p.id !== selectedId && p.id !== "vet-faculty" && p.id !== "vet-hospital") {
        for (var b = 0; b < placed.length; b++) {
          if (Math.abs(sx - placed[b][0]) < 108 && Math.abs(sy - placed[b][1]) < 26) { collide = true; break; }
        }
      }
      if (collide) { el.style.display = "none"; continue; }

      placed.push([sx, sy]);
      el.style.display = "inline-flex";
      el.style.transform = "translate(" + sx.toFixed(1) + "px," + sy.toFixed(1) + "px) translate(-50%,-100%)" + (p.id === selectedId ? " scale(1.08)" : "");
      el.classList.toggle("sel", p.id === selectedId);
    }
  }

  var camAnim = null;
  function flyTo(targetPos, targetLook, dur) {
    camAnim = {
      t0: performance.now(), dur: dur || 820,
      p0: camera.position.clone(), p1: targetPos.clone(),
      l0: controls.target.clone(), l1: targetLook.clone()
    };
  }
  controls.addEventListener("start", function () { camAnim = null; });

  function findPlace(id) {
    for (var i = 0; i < PLACES.length; i++) if (PLACES[i].id === id) return PLACES[i];
    return null;
  }

  function showInfoCard(p) {
    var card = $("infoCard");
    card.textContent = "";
    card.classList.remove("hid");

    var head = mk("div", null, "ic-head");
    var left = mk("div");
    var badges = mk("div", null, "ic-badges");
    var bc = mk("span", p.code, "ic-code");
    bc.style.background = p.color;
    badges.append(bc, mk("span", catObj(p.cat).ar, "ic-cat"), mk("span", AREAS[p.area] || "", "ic-cat"));
    left.append(badges, mk("h2", p.ar), mk("div", p.en, "en"));

    var closeBtn = mk("button", "×", "ic-close");
    closeBtn.type = "button";
    closeBtn.onclick = clearSelection;
    head.append(left, closeBtn);
    card.append(head);

    if (p.info && p.info.length) {
      var sec = mk("div", null, "ic-sec");
      sec.append(mk("h4", "ماذا تجد هنا"));
      var ul = mk("ul");
      p.info.forEach(function (line) { ul.append(mk("li", line)); });
      sec.append(ul);
      card.append(sec);
    }

    var acts = mk("div", null, "ic-actions");
    var centerBtn = mk("button", "توسيط وتقريب 3D", "pb navy");
    centerBtn.type = "button";
    centerBtn.onclick = function () { focusPlace(p, true); };
    acts.append(centerBtn);

    if (p.gmaps && p.gmaps.length === 2) {
      var dirA = mk("a", "اتجاهات Google Maps", "pb gold");
      dirA.href = "https://www.google.com/maps/dir/?api=1&destination=" + p.gmaps[0] + "," + p.gmaps[1];
      dirA.target = "_blank"; dirA.rel = "noopener";
      acts.append(dirA);
    }
    card.append(acts);
  }

  var is2D = false;
  function focusPlace(p, closer) {
    var rad = Math.max(p.w, p.d);
    var dist = closer ? Math.max(22, rad * 1.45) : Math.max(34, rad * 2.05);
    var h = is2D ? dist * 1.38 : dist * 0.68;
    var offZ = is2D ? 2 : dist * 0.88;
    var offX = is2D ? 0 : dist * 0.32;
    flyTo(new THREE.Vector3(p.x + offX, h, p.z + offZ), new THREE.Vector3(p.x, Math.min(p.h * 0.35, 3), p.z), 820);
  }

  function selectPlace(id, doFly) {
    var p = findPlace(id);
    if (!p) return;
    selectedId = id;
    $("dirSheet").classList.remove("open");
    showInfoCard(p);
    var r = Math.max(p.w, p.d) * 0.56 + 1.8;
    selRing.position.set(p.x, 0.5, p.z);
    selRing.scale.set(r, r, 1);
    selRing.visible = true;
    if (doFly) focusPlace(p, false);
  }

  function clearSelection() {
    selectedId = null;
    selRing.visible = false;
    $("infoCard").classList.add("hid");
  }

  var raycaster = new THREE.Raycaster();
  var ptrDown = null;
  canvas.addEventListener("pointerdown", function (e) { ptrDown = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener("pointerup", function (e) {
    if (!ptrDown) return;
    var dx = e.clientX - ptrDown.x, dy = e.clientY - ptrDown.y, dt = performance.now() - ptrDown.t;
    ptrDown = null;
    if (dx * dx + dy * dy > 64 || dt > 450) return;
    var rect = canvas.getBoundingClientRect();
    var mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(clickableMeshes, false);
    if (hits.length && hits[0].object.userData.placeId) selectPlace(hits[0].object.userData.placeId, true);
    else clearSelection();
  });

  function renderCats() {
    var bar = $("catBar"); bar.textContent = "";
    var allBtn = mk("button", null, "cat-pill" + (activeCat === "all" ? " on" : ""));
    allBtn.type = "button";
    allBtn.append(mk("span", "الكل"), mk("small", String(PLACES.length)));
    allBtn.onclick = function () { activeCat = "all"; updateUI(); };
    bar.append(allBtn);

    CATS.forEach(function (c) {
      var cnt = PLACES.filter(function (p) { return p.cat === c.id; }).length;
      var b = mk("button", null, "cat-pill" + (activeCat === c.id ? " on" : ""));
      b.type = "button";
      var d = mk("span", null, "cd"); d.style.background = c.color;
      b.append(d, mk("span", c.ar), mk("small", String(cnt)));
      b.onclick = function () {
        activeCat = c.id; updateUI();
        var list = PLACES.filter(function (p) { return p.cat === c.id; });
        if (list.length) {
          var sx = 0, sz = 0; list.forEach(function (p) { sx += p.x; sz += p.z; });
          var cx = sx / list.length, cz = sz / list.length;
          flyTo(new THREE.Vector3(cx + 8, 86, cz + 104), new THREE.Vector3(cx, 0, cz), 800);
        }
      };
      bar.append(b);
    });
  }

  function renderAreas() {
    var tabs = $("areaTabs"); tabs.textContent = "";
    ["all", "engineering", "central", "medical"].forEach(function (k) {
      var b = mk("button", AREAS[k], "area-tab" + (activeArea === k ? " on" : ""));
      b.type = "button";
      b.onclick = function () { activeArea = k; renderDirectory(); renderAreas(); };
      tabs.append(b);
    });
  }

  function renderDirectory() {
    var grid = $("dirGrid"); grid.textContent = "";
    var list = PLACES.filter(function (p) {
      if (activeCat !== "all" && p.cat !== activeCat) return false;
      if (activeArea !== "all" && p.area !== activeArea) return false;
      return true;
    });
    list.sort(function (a, b) {
      var av = (a.id === "vet-faculty" || a.id === "vet-hospital") ? 0 : a.prio;
      var bv = (b.id === "vet-faculty" || b.id === "vet-hospital") ? 0 : b.prio;
      return av - bv;
    });
    $("dirCount").textContent = list.length + " معلم";
    list.forEach(function (p) {
      var b = mk("button", null, "dir-item"); b.type = "button";
      var code = mk("span", p.code, "dir-code"); code.style.background = p.color;
      var info = mk("div", null, "dir-info");
      info.append(mk("b", p.ar), mk("small", (AREAS[p.area] || "") + " · " + catObj(p.cat).ar));
      b.append(code, info);
      b.onclick = function () { selectPlace(p.id, true); };
      grid.append(b);
    });
  }

  function updateUI() { renderCats(); renderDirectory(); }
  $("sheetToggle").onclick = function () { $("dirSheet").classList.toggle("open"); };
  renderAreas();
  updateUI();

  var q = $("q"), res = $("res");
  q.oninput = function () {
    var t = norm(q.value.trim()); res.textContent = "";
    if (!t) { res.classList.add("hid"); return; }
    var hits = PLACES.filter(function (p) {
      return norm(p.code + " " + p.ar + " " + p.en + " " + catObj(p.cat).ar + " " + (AREAS[p.area] || "")).indexOf(t) !== -1;
    });
    if (!hits.length) {
      var li0 = mk("li"); li0.append(mk("button", "لا توجد نتائج مطابقة")); res.append(li0);
      res.classList.remove("hid"); return;
    }
    hits.slice(0, 12).forEach(function (p) {
      var li = mk("li"), b = mk("button"); b.type = "button";
      var rc = mk("span", p.code, "rc"); rc.style.background = p.color;
      var rm = mk("span", null, "rm");
      rm.append(mk("b", p.ar), mk("span", (AREAS[p.area] || "") + " · " + catObj(p.cat).ar));
      b.append(rc, rm);
      b.onclick = function () { res.classList.add("hid"); q.value = p.ar; selectPlace(p.id, true); };
      li.append(b); res.append(li);
    });
    res.classList.remove("hid");
  };
  document.addEventListener("click", function (e) { if (!e.target.closest(".sb")) res.classList.add("hid"); });

  $("jumpG1").onclick = function () { selectPlace("vet-faculty", true); };
  $("jumpVH").onclick = function () { selectPlace("vet-hospital", true); };

  $("btnZoomIn").onclick = function () {
    var dir = camera.position.clone().sub(controls.target).multiplyScalar(0.75);
    if (dir.length() < controls.minDistance) dir.setLength(controls.minDistance);
    flyTo(controls.target.clone().add(dir), controls.target.clone(), 400);
  };
  $("btnZoomOut").onclick = function () {
    var dir = camera.position.clone().sub(controls.target).multiplyScalar(1.32);
    if (dir.length() > controls.maxDistance) dir.setLength(controls.maxDistance);
    flyTo(controls.target.clone().add(dir), controls.target.clone(), 400);
  };
  $("btnCompass").onclick = function () {
    var dist = camera.position.distanceTo(controls.target);
    var h = is2D ? dist : dist * 0.58;
    var z = is2D ? 2 : dist * 0.82;
    flyTo(new THREE.Vector3(controls.target.x, h, controls.target.z + z), controls.target.clone(), 650);
  };
  $("btn2D").onclick = function () {
    is2D = !is2D;
    $("btn2D").textContent = is2D ? "3D" : "2D";
    $("btn2D").classList.toggle("on", is2D);
    var dist = Math.max(58, camera.position.distanceTo(controls.target));
    if (is2D) flyTo(new THREE.Vector3(controls.target.x, dist * 1.18, controls.target.z + 2), controls.target.clone(), 750);
    else flyTo(new THREE.Vector3(controls.target.x + 8, dist * 0.58, controls.target.z + dist * 0.82), controls.target.clone(), 750);
  };
  $("btnLbl").onclick = function () {
    labelMode = (labelMode + 1) % 3;
    $("btnLbl").classList.toggle("on", labelMode !== 0);
    toast(labelMode === 1 ? "عرض الأسماء: ذكي (أهم المعالم)" : (labelMode === 2 ? "عرض الأسماء: كل المباني" : "إخفاء الأسماء"));
  };
  $("btnReset").onclick = function () {
    is2D = false; $("btn2D").textContent = "2D"; $("btn2D").classList.remove("on");
    clearSelection(); flyTo(DEFAULT_POS, DEFAULT_TGT, 850);
  };
  $("btnFull").onclick = function () {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
  };

  function applyTheme(dark) {
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if (dark) {
      scene.background = skyNight;
      scene.fog.color.setHex(0x10203a);
      sunLight.intensity = 0.72; sunLight.color.setHex(0xb8d2f8);
      hemiLight.intensity = 0.55;
    } else {
      scene.background = skyDay;
      scene.fog.color.setHex(0xe4e8e2);
      sunLight.intensity = 1.3; sunLight.color.setHex(0xfff5e0);
      hemiLight.intensity = 0.94;
    }
  }
  applyTheme(localStorage.getItem("vet_theme") === "dark");
  $("thBtn").onclick = function () {
    var nextDark = document.documentElement.dataset.theme !== "dark";
    localStorage.setItem("vet_theme", nextDark ? "dark" : "light");
    applyTheme(nextDark);
  };

  window.addEventListener("resize", function () {
    var w = wrap.clientWidth, h = wrap.clientHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
  });

  var compassNeedle = $("compassNeedle");
  function animate(now) {
    requestAnimationFrame(animate);
    var t = now * 0.001;
    if (camAnim) {
      var p = Math.min((now - camAnim.t0) / camAnim.dur, 1);
      var ease = 1 - Math.pow(1 - p, 3);
      camera.position.lerpVectors(camAnim.p0, camAnim.p1, ease);
      controls.target.lerpVectors(camAnim.l0, camAnim.l1, ease);
      if (p >= 1) camAnim = null;
    }
    controls.update();

    var az = controls.getAzimuthalAngle ? controls.getAzimuthalAngle() : 0;
    compassNeedle.style.transform = "rotate(" + (az * 180 / Math.PI).toFixed(1) + "deg)";

    for (var i = 0; i < beacons.length; i++) {
      beacons[i].mesh.rotation.y = t * 1.2;
      beacons[i].mesh.position.y = beacons[i].baseY + Math.sin(t * 2.2 + beacons[i].phase) * 0.5;
    }
    if (selRing.visible) selRing.material.opacity = 0.62 + Math.sin(t * 4) * 0.28;
    if (waterMesh) waterMesh.material.emissiveIntensity = 0.14 + Math.sin(t * 1.8) * 0.05;

    renderer.render(scene, camera);
    updateLabels();
  }

  requestAnimationFrame(animate);
  setTimeout(function () {
    $("loader").classList.add("done");
    toast("حرم التكنو 3D جاهز — قرّب على البوابة، العجلوني 410، والبيطري G1", 4200);
  }, 350);
})();
</script>
</body>
</html>
